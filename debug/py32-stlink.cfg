# Verified with the OpenOCD build bundled in Puya's PY32F002B SDK.
source [find interface/stlink-dap.cfg]
source [find target/py32f002b.cfg]
# Preserve application RAM when OpenOCD uses it for flash checksums.
$_TARGETNAME configure -work-area-backup 1
reset_config none
adapter speed 100
# Vendor reset hooks otherwise increase the SWD speed.
proc py32f002b_default_reset_start {} { adapter speed 100 }
proc py32f002b_default_reset_init {} { adapter speed 100 }

# Enable debugger-backed standard output after target initialization.
py32f002b.cpu configure -event halted { arm semihosting enable }
